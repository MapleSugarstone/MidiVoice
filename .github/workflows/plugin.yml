# Builds the MidiVoice plugin (VST3 + CLAP) for all three desktop platforms.
# Runs on demand, and publishes a release when a plugin-v* tag is pushed.
name: plugin

on:
  workflow_dispatch:
  push:
    tags: ['plugin-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcursor-dev
      - name: Build
        working-directory: plugin
        run: cargo xtask bundle midivoice_plugin --release
      - uses: actions/upload-artifact@v4
        with:
          name: midivoice-plugin-${{ matrix.label }}
          path: plugin/target/bundled/

  release:
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip per platform
        run: |
          cd artifacts
          for d in midivoice-plugin-*; do (cd "$d" && zip -r "../$d.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
