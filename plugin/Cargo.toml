[package]
name = "midivoice_plugin"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Sing into a track, MIDI notes come out. The MidiVoice detector as a DAW plugin."

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[profile.release]
lto = "thin"
strip = "symbols"
